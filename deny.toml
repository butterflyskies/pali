# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[graph]
targets = []
all-features = true

# --- Advisories -----------------------------------------------------------
# Replaces standalone `cargo audit`.
[advisories]
ignore = [
    # Transitive deps we can't control — unmaintained, not vulnerable.
    { id = "RUSTSEC-2024-0436", reason = "paste: transitive via thiserror/serde derive macros" },
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile: transitive via rustls-native-certs 0.7 → ureq 2 (native-certs feature)" },
    # Source-reviewed exception (2026-10-17): these affect ZIP extraction.
    # Pali loads safetensors; Candle's optional NPZ/PTH code reads archives and
    # never calls extract(). No published Candle release permits fixed ZIP 9.
    # Revisit on a model-format/extraction change or when Candle permits ZIP 9.
    { id = "RUSTSEC-2026-0367", reason = "Candle ZIP dependency: privileged-bit extraction is unreachable from Pali's safetensors loader" },
    { id = "RUSTSEC-2026-0368", reason = "Candle ZIP dependency: symlink extraction is unreachable from Pali's safetensors loader" },
    { id = "RUSTSEC-2026-0369", reason = "Candle ZIP dependency: permission updates through extracted symlinks are unreachable from Pali's safetensors loader" },
]

# --- Licenses -------------------------------------------------------------
[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "BSL-1.0",
    "MPL-2.0",
]
confidence-threshold = 0.8
exceptions = [
    # Mozilla root certificate data — permissive data license. Both crates are
    # present while transitive HTTP stacks converge on the renamed package.
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots" },
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-root-certs" },
]

# --- Bans ------------------------------------------------------------------
[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

# --- Sources ---------------------------------------------------------------
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
