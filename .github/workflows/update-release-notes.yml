# Update GitHub release notes with git-cliff output.
# Called by the release workflow before its terminal undraft step.
name: Update Release Notes

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      control_ref:
        required: true
        type: string
      source_ref:
        required: true
        type: string

permissions:
  contents: write

env:
  # Release tags must be SSH-signed annotated tags or listed legacy tags;
  # scripts/verify-remote-release-tag.sh enforces it. Reusable workflows do
  # not inherit the caller's env, so every release workflow sets it.
  TAG_SIGNING: ssh

jobs:
  update-notes:
    runs-on: ubuntu-latest
    environment: release
    steps:
      # fetch-depth: 0 is required — git-cliff reads the full commit history
      # to generate changelog entries from conventional commits.
      - name: Check out release source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.source_ref }}
          path: release-source
          fetch-depth: 0
          persist-credentials: false
      - name: Check out release control code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.control_ref }}
          path: .release-control
          persist-credentials: false
      - name: Verify release tag binding
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        working-directory: release-source
        run: ../.release-control/scripts/verify-remote-release-tag.sh origin "$RELEASE_TAG" "$(git rev-parse HEAD)" "$DEFAULT_BRANCH"

      - name: Generate release notes
        id: cliff
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4.8.0
        with:
          config: github-keepachangelog
          args: --latest --strip all
          workdir: release-source
        env:
          OUTPUT: ${{ runner.temp }}/release-notes.md
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}

      - name: Update release body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          (cd release-source && ../.release-control/scripts/verify-remote-release-tag.sh \
            origin "$RELEASE_TAG" "$(git rev-parse HEAD)" "$DEFAULT_BRANCH")
          gh release edit "$RELEASE_TAG" \
            --notes-file "${{ runner.temp }}/release-notes.md" \
            --repo "${{ github.repository }}"
