# Access fixture cases: operation x requester view x inputs.
#
# Every name, scope and body in this fixture is fictional.
#
# Fields
#   id              unique case id; also the key in before.json
#   op              read | recall | list | remember | edit | move | forget
#   view            the requester view the request expresses with today's
#                   scope arguments:
#                     root_only       scope omitted or "global"
#                                     (ScopeFilter::RootOnly / Scope::Root)
#                     one_scope       a single Scope::Path (point operations:
#                                     read, remember, edit, move, forget)
#                     scope_and_root  ScopeFilter::Subtree over a scope with no
#                                     child scopes (list, recall)
#                     several_scopes  ScopeFilter::Subtree over a scope that has
#                                     child scopes (list, recall)
#                     all             ScopeFilter::All (list, recall)
#   principal       fictional requester; not consulted by today's pali
#   intended_grant  what that principal should be allowed, as
#                   "<scope>:<rights>" items separated by "; ". Input to the
#                   after column only; not consulted by today's pali.
#   after           the proposed outcome. "open" means the policy choice is
#                   unresolved and no outcome is asserted.
#   note            what the case probes
#   Operation inputs, passed to the tool as-is: scope, name, query, limit,
#   content, tags, tags_all, from_scope, to_scope, new_name.
#                   tags_all is accepted only on recall and list; on recall
#                   a non-empty filter goes through the candidate allow-list,
#                   and fused/BM25 scores are then not recorded.
#   probe           optional recall run after a write, recorded with it
#   observe         optional observation projection: the dotted field paths
#                   of the recorded "before" result that replay compares
#                   (arrays are transparent, so "hits.name" is every hit's
#                   name). Omitted means the full record is compared. Every
#                   path must exist in the observed result. Memory ids,
#                   timestamps, recall ids, timing metadata, git history and
#                   raw bodies are never recorded; see before.json
#                   "never_recorded".

